name: Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU Variant"
        required: true
        type: choice
        options:
          - xxksu
        default: xxksu
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional, N or blank = current UTC)"
        required: false
        type: string
        default: "Thu Jul 16 14:32:05 UTC 2026"
      enable_nomount:
        required: true
        type: choice
        options:
          - "disabled"
          - "master"
          - "dev"
        default: "dev"
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"
      droidspaces_ntsync:
        description: "Enable Droidspaces container NTSync support (requires Droidspaces to be enabled)"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG anti-brick protection"
        required: true
        type: boolean
        default: true
      use_networking:
        description: "Enable Networking (BBRv3)"
        required: true
        type: boolean
        default: true
      use_perf:
        description: "Experimental performance config"
        required: true
        type: boolean
        default: true

jobs:
  flush-cache:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Flush GitHub Actions cache
        run: |
          gh cache list --json id --jq '.[].id' | \
          xargs -I{} gh cache delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build-kernels-a15-6-6:
    needs: flush-cache
    if: always() && (needs.flush-cache.result == 'success' || needs.flush-cache.result == 'skipped')
    name: "6.6.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "139"
            os_patch_level: "2026-07"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_bbg: ${{ inputs.use_bbg }}
      use_networking: ${{ inputs.use_networking }}
      use_perf: ${{ inputs.use_perf }}
      enable_nomount: ${{ inputs.enable_nomount }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
