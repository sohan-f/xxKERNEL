name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

      ksu_variant:
        required: true
        type: string

      flavor:
        required: false
        type: string
        default: "perf"

      version:
        required: false
        type: string
      build_time:
        required: false
        type: string

      use_bbg:
        required: true
        type: boolean
        default: true
      use_networking:
        required: true
        type: boolean
        default: false
      use_perf:
        required: true
        type: boolean
        default: true
      enable_nomount:
        required: true
        type: string
      droidspaces:
        required: false
        type: string
      droidspaces_ntsync:
        required: false
        type: boolean

    outputs:
      actual-sublevel:
        description: Actual kernel SUBLEVEL from LTS source
        value: ${{ jobs.build-kernel.outputs.actual-sublevel }}

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}-lts-${{ inputs.android_version }}-lts-${{ inputs.ksu_variant }}-${{ inputs.flavor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      actual-sublevel: ${{ steps.source.outputs.sublevel }}

    steps:
      - name: Build summary
        run: |
          echo "Android: ${{ inputs.android_version }}"
          echo "Kernel: ${{ inputs.kernel_version }}-lts (tracking common-${{ inputs.android_version }}-${{ inputs.kernel_version }}-lts)"
          echo "KSU: ${{ inputs.ksu_variant }} (${{ inputs.flavor }})"
          echo "Build Time: ${{ inputs.build_time }}"
          echo "BBG: ${{ inputs.use_bbg }}"
          echo "Droidspaces: ${{ inputs.droidspaces }}"
          echo "NTSync: ${{ inputs.droidspaces_ntsync }}"

      - name: Clean up disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - uses: actions/checkout@v7

      - name: Setup
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: bash .github/scripts/setup.sh

      - name: Manifest
        id: manifest
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: bash .github/scripts/manifest.sh

      - name: Cleanup cache
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          MANIFEST_HASH: ${{ env.MANIFEST_HASH }}
        run: bash .github/scripts/cleanup-cache.sh

      - name: Restore source
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.KERNEL_ROOT }}
          key: kernel-source-${{ inputs.android_version }}-${{ inputs.kernel_version }}-lts-${{ env.MANIFEST_HASH }}

      - name: Sync source
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: bash $GITHUB_WORKSPACE/.github/scripts/sync.sh

      - name: Save source
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.KERNEL_ROOT }}
          key: kernel-source-${{ inputs.android_version }}-${{ inputs.kernel_version }}-lts-${{ env.MANIFEST_HASH }}

      - name: Finalize source
        id: source
        run: bash .github/scripts/finalize-source.sh

      - name: Stock spoofing (disabled)
        if: false
        run: bash .github/scripts/stock-spoof.sh

      - name: KernelSU
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: bash .github/scripts/ksu.sh

      - name: Features
        env:
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          DROIDSPACES: ${{ inputs.droidspaces }}
          DROIDSPACES_NTSYNC: ${{ inputs.droidspaces_ntsync }}
          ANDROID_VERSION: ${{ inputs.android_version }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          USE_BBG: ${{ inputs.use_bbg }}
          USE_NETWORKING: ${{ inputs.use_networking }}
          USE_PERF: ${{ inputs.use_perf }}
        run: bash .github/scripts/features.sh

      - name: Version
        env:
          VERSION: ${{ inputs.version }}
          INPUT_TIME: ${{ inputs.build_time }}
        run: bash .github/scripts/version.sh

      - name: Compile
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 60
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"
            export ATTEMPT LOG_FILE
            bash .github/scripts/compile.sh

      - name: Package
        run: bash .github/scripts/package.sh

      - name: Upload AnyKernel3
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ env.ACTUAL_SUBLEVEL }}-lts-${{ inputs.flavor }}-AnyKernel3
          path: ${{ env.ANYKERNEL3 }}/*
          if-no-files-found: error
          compression-level: 9
