name: Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      use_bbg:
        description: "Enable BBG anti-brick protection"
        required: true
        type: boolean
        default: true
      use_networking:
        description: "Enable BBRv3 networking"
        required: true
        type: boolean
        default: true
      use_perf:
        description: "Enable performance patches"
        required: true
        type: boolean
        default: true
      use_droidspaces:
        description: "Enable Droidspaces"
        required: true
        type: boolean
        default: true
      droidspaces_ntsync:
        description: "Enable NTSync (requires Droidspaces)"
        required: true
        type: boolean
        default: false
      use_stock_config_spoof:
        description: "Use stock_defconfig for the embedded kernel config"
        required: true
        type: boolean
        default: false
      lto_o3:
        description: "Add --lto-O3 to the LTO link (experimental: larger vmlinux and longer links)"
        required: true
        type: boolean
        default: false
      use_cgroup_limits:
        description: "Enable CFS bandwidth + pids controllers together with the cgroup limits kABI patch"
        required: true
        type: boolean
        default: false

      lto_full:
        description: "Use full LTO instead of thin LTO (experimental: for bisecting the full LTO bootloop)"
        required: true
        type: boolean
        default: false
      panic_visible:
        description: "Keep panic_on_oops off and let a panic time out, so oopses print instead of rebooting silently"
        required: true
        type: boolean
        default: false

      build_time:
        description: "Kernel build time hardcoded into the version string, e.g. 'Sun Dec 01 08:10:00 UTC 2024' (blank = now)"
        required: false
        type: string

env:
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_BRANCH: common-android15-6.6-lts

  KBUILD_BUILD_VERSION: "1"
  KBUILD_BUILD_USER: sohan
  KBUILD_BUILD_HOST: cuscoi

  # Device CPU: 4x Cortex-A55 (LITTLE) + 4x Cortex-A78 (big), ARMv8.2-a
  TARGET_CPU: "cortex-a78"

jobs:
  build-kernel:
    name: "6.6 (android15)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Build summary
        run: |
          echo "Android: $ANDROID_VERSION"
          echo "Kernel: $KERNEL_VERSION"
          echo "Branch: $KERNEL_BRANCH"
          echo "BBG: ${{ inputs.use_bbg }}"
          echo "BBRv3: ${{ inputs.use_networking }}"
          echo "Performance: ${{ inputs.use_perf }}"
          echo "Droidspaces: ${{ inputs.use_droidspaces }}"
          echo "NTSync: ${{ inputs.droidspaces_ntsync }}"
          echo "Stock config spoofing: ${{ inputs.use_stock_config_spoof }}"
          echo "LTO -O3 link: ${{ inputs.lto_o3 }}"
          echo "Cgroup limits: ${{ inputs.use_cgroup_limits }}"
          echo "Full LTO: ${{ inputs.lto_full }}"
          echo "Panic visible: ${{ inputs.panic_visible }}"
          echo "Build time: ${{ inputs.build_time }}"

          SUFFIX=""
          if [ "${{ inputs.lto_full }}" = "true" ]; then SUFFIX="${SUFFIX}-lto-full"; fi
          if [ "${{ inputs.panic_visible }}" = "true" ]; then SUFFIX="${SUFFIX}-panic-visible"; fi
          echo "FLAVOR_SUFFIX=${SUFFIX}" >> "$GITHUB_ENV"
          echo "Flavor: ${SUFFIX:-default}"

      - name: Clean up disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup swap for LTO link
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h
          df -h /mnt

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build environment
        run: |
          CONFIG="$ANDROID_VERSION-$KERNEL_VERSION"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> "$GITHUB_ENV" << EOF
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> "$GITHUB_ENV"

      - name: Resolve kernel manifest HEAD
        run: |
          MANIFEST_HASH=$(git ls-remote https://android.googlesource.com/kernel/manifest \
            "refs/heads/${KERNEL_BRANCH}" | awk -F'\t' '{print substr($1, 1, 12)}')
          echo "MANIFEST_HASH=${MANIFEST_HASH}" >> "$GITHUB_ENV"
          echo "Branch: ${KERNEL_BRANCH}"
          echo "Manifest: ${MANIFEST_HASH}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: Configure Git identity
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"

      - name: Clone dependencies
        run: |
          ANYKERNEL_BRANCH="cuscoi"

          git clone --depth=1 -b "$ANYKERNEL_BRANCH" https://github.com/sohan-f/AnyKernel3.git
          git init kernel_patches
          git -C kernel_patches remote add origin https://github.com/WildKernels/kernel_patches.git
          git -C kernel_patches fetch --depth=1 origin 757201d983e2549dc7945a21fa6a056eb2e55263
          git -C kernel_patches checkout --detach FETCH_HEAD

          rm -rf AnyKernel3/.git kernel_patches/.git

      - name: Restore kernel source
        id: restore-kernel-source
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.KERNEL_ROOT }}
          key: kernel-source-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.MANIFEST_HASH }}

      - name: Sync kernel source
        if: steps.restore-kernel-source.outputs.cache-hit != 'true'
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -e

          echo "Syncing $KERNEL_BRANCH"

          "$REPO" init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$KERNEL_BRANCH" \
            --repo-rev=v2.16

          "$REPO" sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --fail-fast

          echo "Revision: $(git -C common log -1 --oneline)"
          echo "Branch: $(git -C common branch --show-current)"

      - name: Cache kernel source
        if: steps.restore-kernel-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.KERNEL_ROOT }}
          key: kernel-source-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.MANIFEST_HASH }}

      - name: Resolve kernel sublevel
        run: |
          SUBLEVEL="$(awk '/^SUBLEVEL = / { print $3 }' "$KERNEL_ROOT/common/Makefile")"
          if [[ ! "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "::error::SUBLEVEL not found in $KERNEL_ROOT/common/Makefile"
            exit 1
          fi
          echo "KERNEL_SUBLEVEL=$SUBLEVEL" >> "$GITHUB_ENV"
          echo "Sublevel: $SUBLEVEL"

      - name: Backup baseline defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: Apply Stock Config spoofing
        if: inputs.use_stock_config_spoof
        run: |
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$STOCK_SRC" ]; then
            echo "::error::Stock config not found: $STOCK_SRC"
            exit 1
          fi
          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::Kernel Makefile not found: $TARGET_MAKEFILE"
            exit 1
          fi

          cp "$STOCK_SRC" "$STOCK_DST"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data already uses stock_defconfig"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
          else
            echo "::error::Could not find config_data rule in $TARGET_MAKEFILE"
            exit 1
          fi

      - name: Integrate KernelSU
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          BRANCH="master"

          curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s "$BRANCH"

          cd common
          # patch -p1 < "${{ github.workspace }}/backslashxx_hooks/manual_hooks.patch"
          patch -p1 < "${{ github.workspace }}/backslashxx_hooks/exec_failfast.patch"
          # patch -p1 < "${{ github.workspace }}/backslashxx_hooks/manual_security_hooks.patch"
          patch -p1 < "${{ github.workspace }}/backslashxx_hooks/thermal_patch.patch"
          cd ..

          cd KernelSU
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          KSU_VERSION=$((20000 + KSU_GIT_VERSION))

          if [ -f "kernel/Kbuild" ]; then
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          fi

          patch -p1 < "${{ github.workspace }}/backslashxx_hooks/cpu_optimization.patch"
          cd ..

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> "$GITHUB_ENV"
          else
            echo "KSU_LATEST_COMMIT_DATE=Unknown" >> "$GITHUB_ENV"
          fi

          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_config_block "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          CONFIG_PREEMPT=y
          CONFIG_NO_HZ_IDLE=y
          CONFIG_CPU_IDLE=y
          CONFIG_CPU_IDLE_GOV_MENU=y
          CONFIG_CPU_FREQ=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_SCHED_THERMAL_PRESSURE=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y

          CONFIG_PM_AUTOSLEEP=y
          CONFIG_PM_WAKELOCKS=y
          CONFIG_CPU_THERMAL=y
          CONFIG_DEVFREQ_THERMAL=y

          CONFIG_F2FS_FS_COMPRESSION=y

          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y

          CONFIG_KSU_NOPRINTK=y
          CONFIG_KSU_FEATURE_SULOG=n
          CONFIG_KSU_FEATURE_ADBROOT=n

          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_HOSTSREDIRECT=n
          EOF

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Keep oopses visible
        if: inputs.panic_visible
        run: |
          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_line "# CONFIG_PANIC_ON_OOPS is not set" "$DEFCONFIG"
          apply_line "CONFIG_PANIC_TIMEOUT=15" "$DEFCONFIG"

      - name: Enable LTO -O3 link
        if: inputs.lto_o3
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          patch -p1 < "${{ github.workspace }}/backslashxx_hooks/lto_o3.patch"

      - name: Fix cgroup limits kABI
        if: inputs.use_cgroup_limits
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          CGROUP_PATCH="${{ github.workspace }}/droidspaces_patch/fix_cgroup_limits_kabi_6.6.patch"

          if [ -f "$CGROUP_PATCH" ]; then
            if ! patch -p1 -F3 --forward < "$CGROUP_PATCH"; then
              echo "::warning::cgroup limits kABI patch did not apply; already applied or context mismatch"
            fi
          else
            echo "::warning::cgroup limits kABI patch missing: $CGROUP_PATCH"
          fi

          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_config_block "$DEFCONFIG" <<'EOF'
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          EOF

      - name: Integrate Droidspaces
        if: inputs.use_droidspaces
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          PATCH_FILE="/tmp/droidspaces.patch"

          curl -fLSs "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" -o "$PATCH_FILE"

          if ! patch -p1 --forward < "$PATCH_FILE"; then
            echo "::warning::SYSVIPC kABI patch did not apply; already applied or context mismatch"
          fi

          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_config_block "$DEFCONFIG" <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_NF_TARGET_REJECT=y
          EOF

          rm -f "$PATCH_FILE"

      - name: Enable x86_64 emulation (binfmt)
        if: inputs.use_droidspaces
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_config_block "$DEFCONFIG" <<'EOF'
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          EOF

      - name: Integrate NTSync
        if: inputs.use_droidspaces && inputs.droidspaces_ntsync
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -e

          NTSYNC_PATCH="ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}"
          NTSYNC_URL="https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync"

          wget -q "$NTSYNC_URL/ntsync_base.patch"
          wget -q "$NTSYNC_URL/${NTSYNC_PATCH}.patch"

          patch -p1 < "ntsync_base.patch"
          patch -p1 < "${NTSYNC_PATCH}.patch"

          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"
          apply_line "CONFIG_NTSYNC=y" "$DEFCONFIG"

      - name: Integrate BBG
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: Integrate BBRv3 networking
        if: inputs.use_networking
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          source "${{ github.workspace }}/.github/scripts/kernel-config.sh"

          patch -p1 < "$KERNEL_PATCHES/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android15-6.6.patch"

          apply_config_block "$DEFCONFIG" <<'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NET_ACT_CONNMARK=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_WIREGUARD=y
          CONFIG_TCP_CONG_BBR3=y
          EOF

      - name: Apply performance patches
        if: inputs.use_perf
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          patch -p1 --forward < "$KERNEL_PATCHES/common/optimized_mem_operations.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/file_struct_8bytes_align.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/reduce_cache_pressure.patch"

          patch -p1 --forward < "$KERNEL_PATCHES/common/mem_opt_prefetch.patch"

          patch -p1 --forward < "$KERNEL_PATCHES/common/optimise_memcmp.patch"

          patch -p1 --forward < "$KERNEL_PATCHES/common/minimise_wakeup_time.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/int_sqrt.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/force_tcp_nodelay.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/reduce_gc_thread_sleep_time.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/add_timeout_wakelocks_globally.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/f2fs_reduce_congestion.patch"
          patch -p1 --forward < "$KERNEL_PATCHES/common/reduce_freeze_timeout.patch"

          sed \
            -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
            "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" | patch -p1 -F3 --forward

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/add_limitation_scaling_min_freq.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/re_write_limitation_scaling_min_freq.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/adjust_cpu_scan_order.patch"

          FILE="drivers/base/power/wakeup.c"

          if grep -q "^void pm_system_wakeup(void)" "$FILE"; then
            if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
              sed -i '/^void pm_system_wakeup(void)/,/^}/{
                /suspend_abort_fs_sync();/d
              }' "$FILE"
            fi
          fi

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/disable_cache_hot_buddy.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/f2fs_enlarge_min_fsync_blocks.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/increase_ext4_default_commit_age.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/increase_sk_mem_packets.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/reduce_pci_pme_wakeups.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/silence_irq_cpu_logspam.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/silence_system_logspam.patch"

          patch -p1 -F3 --forward < "$KERNEL_PATCHES/common/use_unlikely_wrap_cpufreq.patch"

      - name: Configure version string
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i '/stable_scmversion_cmd/s/-maybe-dirty//g' ./build/kernel/kleaf/impl/stamp.bzl

          cd ./common

          BID="ab10000069"
          GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
          KMI_TAG="android15-8"

          SUFFIX="-${KMI_TAG}-g${GHASH}-${BID}"

          perl -i -0777 -pe \
            's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'"/s' \
            ./scripts/setlocalversion

          echo "Expected version: $(make -s kernelversion)"

      - name: Set custom build time
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::warning title=Build time format error::Custom build time must be formatted like 'Sun Dec 01 08:10:00 UTC 2024'. Please remove extra prefixes and use a two-digit day."
              exit 1
            fi

            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %d %T UTC %Y' 2>/dev/null || true)"
            if [[ "$NORMALIZED_TIME" != "$INPUT_TIME" ]]; then
              echo "::warning title=Invalid build time::Custom build time cannot be parsed as valid UTC time, or the day of the week does not match the date."
              exit 1
            fi

            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi

          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"

          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            echo "Applying 6.x mkcompile_h patch: $f"
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
            fi
          fi

      - name: Verify kernel version
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Git describe: $(git describe --always --dirty --long)"
          echo "Kernel version: $(make -s kernelversion)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile

      - name: Compile kernel
        id: compile_kernel
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/compile.log"

          set -o pipefail
          {
            echo "Start: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "KernelSU: ${KSU_LATEST_COMMIT_DATE}"
            set -ex
            cd "$KERNEL_ROOT"

            FRAG="common/arch/arm64/configs/ksu.fragment"
            diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
            cp "$DEFCONFIG.orig" "$DEFCONFIG"
            echo "Defconfig fragment:"
            cat "$FRAG"

            FRAG_ARGS=()
            if [ -s "$FRAG" ]; then
              FRAG_ARGS=(--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment)
            fi

            LTO_MODE=thin
            if [ "${{ inputs.lto_full }}" = "true" ]; then
              LTO_MODE=full
            fi

            tools/bazel build \
                --config=fast \
                "--lto=${LTO_MODE}" \
                "${FRAG_ARGS[@]}" \
                --action_env=PATH \
                --action_env="KCFLAGS=-march=armv8.2-a+crypto+fp16+dotprod+rcpc+dcpop -mtune=${TARGET_CPU}" \
                //common:kernel_aarch64_dist || exit 1

            strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'
          } 2>&1 | tee "$LOG_FILE"

          BUILD_STATUS=${PIPESTATUS[0]}
          {
            echo "End: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Exit: $BUILD_STATUS"
          } >> "$LOG_FILE"
          exit "$BUILD_STATUS"

      - name: Prepare AnyKernel3
        working-directory: ${{ env.ANYKERNEL3 }}
        run: |
          SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          cp "$SRC_DIR/Image" ./Image

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.${{ env.KERNEL_SUBLEVEL }}-AnyKernel3${{ env.FLAVOR_SUFFIX }}
          path: |
            ${{ env.ANYKERNEL3 }}/*
          if-no-files-found: error
          compression-level: 9
